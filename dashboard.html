<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mipo Group Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>

<div id="loadingOverlay" style="position:fixed; inset:0; z-index:100; background:#fbfbfd; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif; color:#6e6e73; font-size:13px; letter-spacing:.3px;">
  Memuat data…
</div>

<div class="app-shell">

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-row">
        <svg class="logo-mark" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <path d="M75,237 L75,67.5 L150,156 L225,67.5 L225,216 C225,230 232,237 246,237" />
        </svg>
        <div class="logo-divider"></div>
        <div>
          <div class="logo-text-main">MIPO</div>
          <div class="logo-text-sub">GROUP</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">-</div>
        <div class="user-meta">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Keluar</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <div class="topbar-title" id="pageTitle">Home</div>
          <div class="topbar-sub" id="pageSubtitle">Jadwal client beserta detail lengkapnya</div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=9"></script>
<script src="js/data.js?v=9"></script>
<script src="js/util.js?v=9"></script>

<script src="js/modules/finance.js?v=9"></script>
<script src="js/modules/invoice.js?v=9"></script>
<script src="js/modules/inventory.js?v=9"></script>
<script src="js/modules/maintenance.js?v=9"></script>
<script src="js/modules/settings.js?v=9"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
