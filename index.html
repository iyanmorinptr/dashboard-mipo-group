<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mipo Group Dashboard — Login</title>
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="logo-row">
      <svg class="logo-mark" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <path d="M75,237 L75,67.5 L150,156 L225,67.5 L225,216 C225,230 232,237 246,237" stroke-width="15" />
      </svg>
      <div class="logo-divider"></div>
      <div>
        <div class="logo-text-main">MIPO</div>
        <div class="logo-text-sub">GROUP</div>
      </div>
    </div>

    <p class="welcome-title">Selamat Datang</p>
    <h1 class="welcome-sub">WELCOME TO MIPO DASHBOARD</h1>

    <div id="loginError" class="login-error" style="display:none;"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email Staff</label>
        <input type="email" id="email" name="email" placeholder="nama@mipogroup.com" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginSubmitBtn">Masuk</button>
    </form>

    <p class="login-hint sans">
      Data tersinkron otomatis di semua perangkat. Hubungi Administrator
      jika belum memiliki akun.
    </p>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=9"></script>
<script src="js/data.js?v=9"></script>
<script>
  (function () {
    initDB();

    // sudah login? langsung arahkan ke dashboard
    getInitialAuthUser().then(function (user) {
      if (user) window.location.href = "dashboard.html";
    });

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmitBtn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Memproses...";

      auth
        .signInWithEmailAndPassword(email, password)
        .then(function () {
          window.location.href = "dashboard.html";
        })
        .catch(function (err) {
          errorBox.textContent = mapAuthError(err);
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Masuk";
        });
    });
  })();
</script>
</body>
</html>
